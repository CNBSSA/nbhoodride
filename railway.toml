[build]
builder = "nixpacks"
buildCommand = "npm run build"

[deploy]
preDeployCommand = "npm run db:push"
startCommand = "npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 30
# Always restart (code review 2026-10-06): with on_failure and 3 retries,
# a fourth crash left the service down while the deploy read "successful".
restartPolicyType = "always"
restartPolicyMaxRetries = 10

[deploy.variables]
RAILPACK_INSTALL_CMD = "npm install --include=dev"
